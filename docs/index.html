<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lacné letenky</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<meta name="theme-color" content="#2563eb">
<style>
:root {
  --bg: #f5f6f8; --surface: #fff; --surface-2: #f0f2f5; --border: #e3e6eb;
  --text: #14171c; --muted: #646b76; --faint: #9aa1ab;
  --accent: #2563eb; --accent-2: #1d4ed8; --accent-soft: #e8efff;
  --good: #0f8a4f; --good-soft: #e3f5ec; --warn: #b45309; --warn-soft: #fdf1e3; --bad: #c2362b;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --border: #2a303b;
    --text: #e8eaee; --muted: #9aa3b0; --faint: #6b7380;
    --accent: #5b8cff; --accent-2: #7aa2ff; --accent-soft: #1b2a4d;
    --good: #3ecf8e; --good-soft: #10291f; --warn: #f0a44b; --warn-soft: #2e2213; --bad: #f07167;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; padding-bottom: 96px;
}
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; }
.logo { font-size: 20px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.status { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--good); } .dot.run { background: var(--accent); animation: pulse 1s infinite alternate; } .dot.err { background: var(--bad); }
@keyframes pulse { to { opacity: .3; } }
nav { display: flex; gap: 4px; }
nav button {
  border: 0; background: none; padding: 10px 14px; border-bottom: 2px solid transparent;
  color: var(--muted); font-weight: 600; cursor: pointer;
}
nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
nav .count { background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 1px 7px; font-size: 12px; margin-left: 4px; }

main { padding: 20px 0; }
.tab { display: none; } .tab.active { display: block; }
h2 { font-size: 17px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 99px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .n { opacity: .7; margin-left: 3px; }
.chip.x { cursor: default; display: inline-flex; gap: 6px; align-items: center; }
.chip.x button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; }
select.sort { margin-left: auto; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 13px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.deal { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.deal-head { display: flex; gap: 10px; align-items: flex-start; }
.flag { font-size: 26px; line-height: 1; }
.route { font-weight: 650; font-size: 16px; }
.route small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.price { margin-left: auto; text-align: right; }
.price b { font-size: 22px; letter-spacing: -.02em; }
.badge { display: inline-block; white-space: nowrap; font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 1px 6px; background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.spark { height: 34px; width: 100%; }
.spark-label { font-size: 11px; color: var(--faint); display: flex; justify-content: space-between; margin-top: -4px; }
.actions { display: flex; gap: 6px; margin-top: 2px; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 7px 12px;
  font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1; }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding: 7px 8px; }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.menu { position: relative; }
.menu-pop {
  position: absolute; right: 0; bottom: 100%; margin-bottom: 4px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; z-index: 10; min-width: 210px; display: none;
}
.menu-pop.open { display: block; }
.menu-pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
.menu-pop button:hover { background: var(--surface-2); }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty .big { font-size: 40px; margin-bottom: 8px; }

.region-block { margin-bottom: 22px; }
.rows { overflow: hidden; }
.row { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--border); }
.row:first-child { border-top: 0; }
.row .name { font-weight: 600; font-size: 14px; }
.row .name small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; margin-top: 5px; max-width: 260px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--good); }
.bar i.over { background: var(--warn); }
.row .p { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.row .p small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }

.settings { display: grid; gap: 14px; max-width: 760px; }
.section { padding: 16px; }
.section h3 { margin: 0 0 2px; font-size: 15.5px; }
.section .sub { margin-bottom: 12px; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type=text], input[type=password], input[type=number], select.in {
  border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 8px 10px; width: 100%;
}
input[type=number] { width: 84px; text-align: right; }
input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.region-row { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.region-row:first-of-type { border-top: 0; padding-top: 0; }
.region-row .rname { font-weight: 600; }
.region-row .controls { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.region-row.off .controls, .region-row.off .rname { opacity: .45; }
input[type=range] { width: 180px; accent-color: var(--accent); }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--border); border-radius: 99px; cursor: pointer; transition: .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.watch-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
.watch-row:first-child { border-top: 0; }
.watch-row .name { flex: 1; min-width: 0; }
.watch-row .name small { color: var(--muted); margin-left: 4px; }
.search { position: relative; }
.results {
  position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: 260px; overflow: auto; z-index: 15; display: none;
}
.results.open { display: block; }
.results button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; cursor: pointer; }
.results button:hover, .results button.hl { background: var(--surface-2); }
.results small { color: var(--muted); margin-left: auto; }
.seg { display: inline-flex; justify-self: start; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; border-left: 1px solid var(--border); font-size: 13.5px; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--accent); color: #fff; }
.note { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.note.warn { background: var(--warn-soft); }
code { background: var(--surface-2); border-radius: 5px; padding: 1px 5px; font-size: 12.5px; }
ol.steps { margin: 6px 0 10px; padding-left: 20px; font-size: 13.5px; }
ol.steps li { margin-bottom: 3px; }

.savebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(0,0,0,.08); transform: translateY(110%); transition: transform .2s;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
}
.savebar.show { transform: none; }
.savebar .wrap { display: flex; align-items: center; gap: 10px; }
.savebar .msg { flex: 1; font-size: 14px; font-weight: 600; }
.toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 40;
  max-width: calc(100% - 32px); pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 600px) {
  .status .long { display: none; }
  nav button { padding: 10px 10px; }
  select.sort { margin-left: 0; }
  .grid { grid-template-columns: 1fr; }
  .row { grid-template-columns: 24px 1fr auto; }
  .row .act { grid-column: 2 / -1; justify-self: start; }
  input[type=range] { width: 130px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">✈️ Lacné letenky</div>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Načítavam…</span></div>
    </div>
    <nav>
      <button data-tab="deals" class="active">Ponuky<span class="count" id="dealCount">0</span></button>
      <button data-tab="prices">Ceny teraz</button>
      <button data-tab="settings">Nastavenia</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="tab active" id="tab-deals">
    <div class="toolbar">
      <div class="chips" id="regionChips"></div>
      <select class="sort" id="sort" aria-label="Zoradiť">
        <option value="value">Najvýhodnejšie</option>
        <option value="price">Najlacnejšie</option>
        <option value="date">Najskôr odlet</option>
      </select>
    </div>
    <div class="toolbar"><div class="chips" id="originChips"></div></div>
    <div class="grid" id="dealGrid"></div>
  </section>

  <section class="tab" id="tab-prices">
    <h2>Najlacnejšie destinácie práve teraz</h2>
    <p class="sub">Aj tie nad tvojím limitom. Podľa toho si limity nastavíš tak, aby ti chodili naozaj výhodné ponuky.</p>
    <div id="priceBlocks"></div>
  </section>

  <section class="tab" id="tab-settings">
    <div class="settings" id="settings"></div>
  </section>
</main>

<div class="savebar" id="savebar">
  <div class="wrap">
    <div class="msg">Máš neuložené zmeny</div>
    <button class="btn" id="discardBtn">Zahodiť</button>
    <button class="btn primary" style="flex:none" id="saveBtn">Uložiť a hľadať</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const ORIGIN_OPTIONS = [
  ["VIE", "Viedeň"], ["BTS", "Bratislava"], ["BUD", "Budapešť"], ["PRG", "Praha"], ["KSC", "Košice"],
  ["BRQ", "Brno"], ["KRK", "Krakov"], ["KTW", "Katovice"], ["MUC", "Mníchov"], ["LJU", "Ľubľana"],
];
const REGION_MAX = { europe: 250, middle_east: 500, asia: 1500, north_america: 1500, latam: 2000 };
const REGION_ICON = { europe: "🇪🇺", middle_east: "🕌", asia: "🌏", north_america: "🗽", latam: "🌴", other: "🌍" };
const LS = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
             set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

const S = {
  data: null, history: {}, places: { cities: [], countries: [] },
  config: null, draft: null, sha: null,
  region: LS.get("region") || "all", origin: "all", sort: LS.get("sort") || "value",
  repo: detectRepo(), token: LS.get("gh_token") || "",
};

// ─── Pomocné ───────────────────────────────────────────────────────────────
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https:\/\//.test(u || "") ? u : "#";
const flag = cc => cc && /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : "🌍";
const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
const fmtDate = iso => { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("sk-SK", { day: "numeric", month: "numeric" }); };
const weekday = iso => new Date(iso + "T00:00:00").toLocaleDateString("sk-SK", { weekday: "short" });
const transfers = n => n === 0 ? "priamy let" : `${n} ${plural(n, "prestup", "prestupy", "prestupov")}`;
const clone = o => JSON.parse(JSON.stringify(o));
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "práve teraz";
  if (m < 60) return `pred ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `pred ${h} h`;
  return `pred ${Math.round(h / 24)} d`;
}
function toast(msg, ms = 3500) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), ms);
}
function detectRepo() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (m) {
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return seg ? `${m[1]}/${seg}` : `${m[1]}/${m[1]}.github.io`;
  }
  return LS.get("repo") || "";
}
function placeName(code) {
  const c = S.places.cities.find(x => x[0] === code);
  if (c) return { name: c[1], country: c[2], kind: "city" };
  const k = S.places.countries.find(x => x[0] === code);
  if (k) return { name: k[1], country: code, kind: "country" };
  return { name: code, country: "", kind: "?" };
}
function nowPrice(code) {
  const h = S.history[code];
  if (h && h.points.length) return h.points[h.points.length - 1][1];
  for (const list of Object.values(S.data?.cheapest || {})) {
    const o = list.find(x => x.destination === code); if (o) return o.price;
  }
  return null;
}

// ─── GitHub ────────────────────────────────────────────────────────────────
async function gh(path, opts = {}) {
  const headers = { Accept: "application/vnd.github+json", ...(opts.headers || {}) };
  if (S.token) headers.Authorization = `Bearer ${S.token}`;
  const r = await fetch(`https://api.github.com${path}`, { ...opts, headers });
  if (!r.ok) {
    let msg = `${r.status}`; try { msg += " " + (await r.json()).message; } catch {}
    const e = new Error(msg); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
const b64encode = s => { const b = new TextEncoder().encode(s); let bin = ""; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };

async function loadConfig() {
  if (S.repo) {
    try {
      if (S.token) {
        const f = await gh(`/repos/${S.repo}/contents/config.json?ref=main`);
        S.sha = f.sha; return JSON.parse(b64decode(f.content));
      }
      const r = await fetch(`https://raw.githubusercontent.com/${S.repo}/main/config.json?t=${Date.now()}`);
      if (r.ok) return r.json();
    } catch (e) { console.warn("config", e); }
  }
  for (const p of ["../config.json", "config.json"]) {
    try { const r = await fetch(p, { cache: "no-store" }); if (r.ok) return r.json(); } catch {}
  }
  return null;
}

async function saveConfig() {
  if (!S.repo || !S.token) {
    showTab("settings"); $("#connSection")?.scrollIntoView({ behavior: "smooth" });
    toast("Najprv pripoj GitHub (sekcia Pripojenie).");
    return;
  }
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Ukladám…";
  try {
    if (!S.sha) { const f = await gh(`/repos/${S.repo}/contents/config.json?ref=main`); S.sha = f.sha; }
    const res = await gh(`/repos/${S.repo}/contents/config.json`, {
      method: "PUT",
      body: JSON.stringify({ message: "Nastavenia z aplikácie", content: b64encode(JSON.stringify(S.draft, null, 2) + "\n"), sha: S.sha, branch: "main" }),
    });
    S.sha = res.content.sha; S.config = clone(S.draft);
    updateDirty(); toast("Uložené. Nové vyhľadávanie sa práve spúšťa, výsledky budú o 1–2 minúty.", 5000);
    watchRun();
  } catch (e) {
    if (e.status === 409) { toast("Nastavenia sa medzitým zmenili. Načítavam aktuálne…"); S.config = await loadConfig(); S.draft = clone(S.config); renderSettings(); updateDirty(); }
    else toast(`Uloženie zlyhalo: ${e.message}`, 6000);
  } finally { btn.disabled = false; btn.textContent = "Uložiť a hľadať"; }
}

async function runNow() {
  try {
    await gh(`/repos/${S.repo}/actions/workflows/watch.yml/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main" }) });
    toast("Vyhľadávanie spustené. Výsledky budú o 1–2 minúty."); watchRun();
  } catch (e) {
    toast(e.status === 403 ? "Token nemá oprávnenie Actions: Read and write." : `Nepodarilo sa spustiť: ${e.message}`, 6000);
  }
}

let runTimer = null;
async function refreshRunStatus() {
  if (!S.repo) return null;
  try {
    const r = await gh(`/repos/${S.repo}/actions/workflows/watch.yml/runs?per_page=1`);
    return r.workflow_runs?.[0] || null;
  } catch { return null; }
}
function watchRun() {
  clearInterval(runTimer);
  setStatus("run", "Hľadám nové ceny…");
  let n = 0;
  runTimer = setInterval(async () => {
    n++;
    const run = await refreshRunStatus();
    if (run && run.status === "completed" && n > 2) {
      clearInterval(runTimer);
      if (run.conclusion === "success") { setTimeout(loadData, 45000); setStatus("run", "Hotovo, načítavam výsledky…"); }
      else setStatus("err", "Posledné vyhľadávanie zlyhalo");
    }
    if (n > 40) clearInterval(runTimer);
  }, 10000);
}
function setStatus(kind, text) { $("#statusDot").className = "dot " + kind; $("#statusText").innerHTML = text; }

// ─── Dáta ──────────────────────────────────────────────────────────────────
async function loadData() {
  const t = Date.now();
  const get = p => fetch(`data/${p}?t=${t}`).then(r => r.ok ? r.json() : null).catch(() => null);
  const [deals, history, places] = await Promise.all([get("deals.json"), get("history.json"), get("places.json")]);
  S.data = deals; S.history = history || {}; S.places = places || S.places;
  if (deals) {
    const old = (Date.now() - new Date(deals.updated_at)) / 60000 > 90;
    setStatus(old ? "err" : "ok", `<span class="long">Posledná kontrola </span>${ago(deals.updated_at)}`);
  } else setStatus("err", "Zatiaľ žiadne dáta");
  renderDeals(); renderPrices();
}

// ─── Ponuky ────────────────────────────────────────────────────────────────
function spark(code, limit) {
  const pts = (S.history[code]?.points || []).slice(-45);
  if (pts.length < 2) return "";
  const vals = pts.map(p => p[1]).concat(limit ? [limit] : []);
  const min = Math.min(...vals) * .95, max = Math.max(...vals) * 1.05, W = 300, H = 34;
  const x = i => (i / (pts.length - 1)) * W, y = v => H - ((v - min) / (max - min || 1)) * H;
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const lim = limit ? `<line x1="0" x2="${W}" y1="${y(limit)}" y2="${y(limit)}" stroke="var(--faint)" stroke-dasharray="3 3" stroke-width="1"/>` : "";
  const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${lim}
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div class="spark-label"><span>${pts.length} dní: ${lo}–${hi} €</span>${limit ? `<span>- - limit ${limit} €</span>` : ""}</div>`;
}

function bindConn() {
  $("#connectBtn")?.addEventListener("click", async () => {
    const repo = $("#repoIn").value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, "");
    const token = $("#tokenIn").value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) { toast("Vyplň repozitár (meno/repo) aj token."); return; }
    S.repo = repo; S.token = token;
    try {
      const f = await gh(`/repos/${S.repo}/contents/config.json?ref=main`);
      LS.set("repo", repo); LS.set("gh_token", token);
      S.sha = f.sha; S.config = JSON.parse(b64decode(f.content)); S.draft = clone(S.config);
      toast("Pripojené ✓"); renderSettings(); updateDirty();
    } catch (e) { S.token = ""; toast(`Pripojenie zlyhalo: ${e.message}`, 6000); }
  });
  $("#disconnect")?.addEventListener("click", e => { e.preventDefault(); LS.set("gh_token", null); S.token = ""; renderSettings(); });
  $("#runNowBtn")?.addEventListener("click", runNow);
}

function bindSettings() {
  const c = S.draft, root = $("#settings");
  const changed = (rerender = false) => { updateDirty(); if (rerender) renderSettings(); };

  root.querySelectorAll("[data-origin-toggle]").forEach(b => b.onclick = () => {
    const code = b.dataset.originToggle, i = c.origins.indexOf(code);
    if (i >= 0) { if (c.origins.length === 1) return toast("Aspoň jedno letisko musí zostať."); c.origins.splice(i, 1); } else c.origins.push(code);
    changed(true);
  });
  $("#originAddBtn").onclick = () => {
    const code = $("#originAdd").value.trim().toUpperCase();
    if (!/^[A-Z]{3}$/.test(code)) return toast("Zadaj 3-písmenový IATA kód, napr. VCE.");
    if (!c.origins.includes(code)) c.origins.push(code);
    changed(true);
  };
  root.querySelectorAll("[data-region-on]").forEach(el => el.onchange = () => { c.regions[el.dataset.regionOn].enabled = el.checked; changed(true); });
  root.querySelectorAll("[data-region-price]").forEach(el => el.oninput = () => {
    const k = el.dataset.regionPrice; c.regions[k].max_price = +el.value; root.querySelector(`[data-region-price-n="${k}"]`).value = el.value; changed();
  });
  root.querySelectorAll("[data-region-price-n]").forEach(el => el.oninput = () => {
    const k = el.dataset.regionPriceN, v = Math.max(1, +el.value || 1); c.regions[k].max_price = v; root.querySelector(`[data-region-price="${k}"]`).value = v; changed();
  });
  root.querySelectorAll("[data-region-min]").forEach(el => el.oninput = () => { c.regions[el.dataset.regionMin].min_days = Math.max(1, +el.value || 1); changed(); });
  root.querySelectorAll("[data-region-max]").forEach(el => el.oninput = () => { c.regions[el.dataset.regionMax].max_days = Math.max(1, +el.value || 1); changed(); });
  root.querySelectorAll("[data-watch]").forEach(el => el.oninput = () => { c.watchlist[+el.dataset.watch].max_price = Math.max(1, +el.value || 1); changed(); });
  root.querySelectorAll("[data-unwatch]").forEach(el => el.onclick = () => { c.watchlist.splice(+el.dataset.unwatch, 1); changed(true); });
  root.querySelectorAll("[data-unexclude]").forEach(el => el.onclick = () => { c.excluded = c.excluded.filter(x => x !== el.dataset.unexclude); changed(true); });
  root.querySelectorAll("[data-seg]").forEach(seg => seg.querySelectorAll("button").forEach(b => b.onclick = () => { c[seg.dataset.seg] = +b.dataset.v; changed(true); }));
  root.querySelectorAll("[data-num]").forEach(el => el.oninput = () => { c[el.dataset.num] = Math.max(1, +el.value || 1); changed(); });
  $("#ntfyIn").onchange = () => { c.notify = c.notify || {}; c.notify.ntfy_topic = $("#ntfyIn").value.trim().replace(/[^\w-]/g, ""); changed(true); };
  $("#ntfyGen").onclick = () => {
    const rnd = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
    c.notify = c.notify || {}; c.notify.ntfy_topic = `letenky-${rnd}`; changed(true);
  };
  setupSearch("#watchSearch", "#watchResults", item => addWatch(item.code, item.name));
  setupSearch("#exclSearch", "#exclResults", item => addExclude(item.code));
}

function setupSearch(inputSel, resSel, onPick) {
  const input = $(inputSel), res = $(resSel); let items = [], hl = 0;
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const draw = () => {
    res.innerHTML = items.map((it, i) => `<button class="${i === hl ? "hl" : ""}" data-i="${i}">${flag(it.country)} ${esc(it.name)}<small>${it.kind === "country" ? "celá krajina" : esc(it.code)}</small></button>`).join("");
    res.classList.toggle("open", items.length > 0);
    res.querySelectorAll("button").forEach(b => b.onmousedown = e => { e.preventDefault(); pick(+b.dataset.i); });
  };
  const pick = i => { if (!items[i]) return; onPick(items[i]); input.value = ""; items = []; draw(); };
  input.oninput = () => {
    const q = norm(input.value.trim()); hl = 0;
    if (q.length < 2) { items = []; return draw(); }
    const cities = S.places.cities.filter(c => norm(c[1]).includes(q) || c[0].toLowerCase() === q).map(c => ({ code: c[0], name: c[1], country: c[2], kind: "city" }));
    const countries = S.places.countries.filter(c => norm(c[1]).includes(q) || c[0].toLowerCase() === q).map(c => ({ code: c[0], name: c[1], country: c[0], kind: "country" }));
    items = cities.concat(countries).sort((a, b) => norm(a.name).startsWith(q) === norm(b.name).startsWith(q) ? 0 : norm(a.name).startsWith(q) ? -1 : 1).slice(0, 12);
    if (!items.length && /^[a-z]{3}$/.test(q)) items = [{ code: q.toUpperCase(), name: q.toUpperCase(), country: "", kind: "city" }];
    draw();
  };
  input.onkeydown = e => {
    if (e.key === "ArrowDown") { hl = Math.min(hl + 1, items.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { hl = Math.max(hl - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === "Enter") { pick(hl); e.preventDefault(); }
    else if (e.key === "Escape") { items = []; draw(); }
  };
  input.onblur = () => setTimeout(() => { items = []; draw(); }, 150);
}

function addWatch(code, name, price) {
  const c = S.draft; if (!c) return toast("Nastavenia ešte nie sú načítané.");
  c.watchlist = c.watchlist || [];
  const existing = c.watchlist.find(w => w.code === code);
  const now = price || nowPrice(code);
  const suggested = now ? Math.max(10, Math.round(now * 0.9 / 5) * 5) : 300;
  if (existing) toast(`${name} už sleduješ, limit uprav nižšie.`);
  else { c.watchlist.push({ code, name, max_price: suggested }); toast(`Pridané: ${name}, limit ${suggested} €${now ? " (o 10 % menej ako teraz)" : ""}. Uprav a ulož.`, 4500); }
  c.excluded = (c.excluded || []).filter(x => x !== code);
  renderSettings(); updateDirty();
}
function addExclude(code) {
  const c = S.draft; if (!c) return toast("Nastavenia ešte nie sú načítané.");
  c.excluded = c.excluded || [];
  if (!c.excluded.includes(code)) c.excluded.push(code);
  c.watchlist = (c.watchlist || []).filter(w => w.code !== code);
  toast(`${placeName(code).name} sa už nebude posielať. Nezabudni uložiť.`);
  renderSettings(); updateDirty();
}

function updateDirty() {
  const dirty = S.draft && S.config && JSON.stringify(S.draft) !== JSON.stringify(S.config);
  $("#savebar").classList.toggle("show", !!dirty);
}

// ─── Navigácia a udalosti ──────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.id === `tab-${name}`));
  LS.set("tab", name); window.scrollTo({ top: 0 });
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
$("#sort").onchange = e => { S.sort = e.target.value; LS.set("sort", S.sort); renderDeals(); };
document.addEventListener("click", e => {
  const t = e.target.closest("[data-region],[data-origin],[data-menu],[data-act],[data-goto]");
  document.querySelectorAll(".menu-pop.open").forEach(m => { if (!t || m.id !== `menu-${t.dataset.menu}`) m.classList.remove("open"); });
  if (!t) return;
  if (t.dataset.region) { S.region = t.dataset.region; LS.set("region", S.region); renderDeals(); }
  else if (t.dataset.origin) { S.origin = t.dataset.origin; renderDeals(); }
  else if (t.dataset.menu) $(`#menu-${t.dataset.menu}`).classList.toggle("open");
  else if (t.dataset.goto) { e.preventDefault(); showTab(t.dataset.goto); }
  else if (t.dataset.act === "watch") { addWatch(t.dataset.code, t.dataset.name, +t.dataset.price); showTab("settings"); setTimeout(() => $("#watchList")?.scrollIntoView({ behavior: "smooth", block: "center" }), 50); }
  else if (t.dataset.act === "exclude") addExclude(t.dataset.code);
});
$("#saveBtn").onclick = saveConfig;
$("#discardBtn").onclick = () => { S.draft = clone(S.config); renderSettings(); updateDirty(); };
window.addEventListener("beforeunload", e => { if ($("#savebar").classList.contains("show")) { e.preventDefault(); e.returnValue = ""; } });

(async function init() {
  showTab(LS.get("tab") || "deals");
  await loadData();
  S.config = await loadConfig(); S.draft = S.config ? clone(S.config) : null;
  renderSettings(); renderPrices();
  setInterval(loadData, 5 * 60 * 1000);
})();
</script>
</body>
</html>
