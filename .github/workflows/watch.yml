name: Lacné letenky

on:
  schedule:
    - cron: "7,37 * * * *"    # každých 30 minút
  workflow_dispatch:           # tlačidlo „Spustiť vyhľadávanie teraz“ v aplikácii
  push:
    branches: [main]
    paths: [config.json, watcher.py, "letenky/**", "web/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fronta je len na tomto jobe. Keby sa nasadenie na Pages zaseklo (čaká na
    # schválenie prostredia), nesmie zablokovať hľadanie ani odosielanie e-mailov.
    concurrency:
      group: flight-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testy
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Zostaviť webovú aplikáciu (TypeScript)
        working-directory: web
        run: npm ci && npm run build

      - name: Načítať históriu a stav z vetvy data
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD data | tar -x -C site
          fi

      - name: Hľadať lacné letenky
        run: python watcher.py
        env:
          SITE_DIR: site
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Pridať aplikáciu k dátam
        run: cp -R web/dist/. site/ && touch site/.nojekyll

      - name: Uložiť históriu a stav do vetvy data
        run: |
          cd site
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -qm "Dáta $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Nasadenie na GitHub Pages je samostatný job. Prostredie github-pages vyžaduje
  # actions/deploy-pages, ale keďže tento job nie je vo fronte „flight-watch“,
  # prípadné zaseknutie tu už nezastaví ďalšie behy vyhľadávania.
  deploy:
    needs: watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
